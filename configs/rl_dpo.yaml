model:
  model_name_or_path: Qwen/Qwen2.5-0.5B

data:
  train_file: data/rl/preference_train.jsonl
  max_seq_length: 512
  max_prompt_length: 256

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  output_dir: outputs/dpo_adapter
  num_train_epochs: 1
  per_device_train_batch_size: 1
  learning_rate: 5.0e-5
  logging_steps: 5
  beta: 0.1

